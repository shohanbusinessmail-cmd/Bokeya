name: Build check

on:
  workflow_dispatch:
  push:
    branches: [ "arena/01a0776e-bokeya" ]

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug + release, run unit tests and lint
        id: build
        run: |
          set +e
          # assembleRelease is included so minification/R8 and the release
          # manifest are validated too, not just the debug variant.
          ./gradlew --no-daemon --stacktrace \
            assembleDebug assembleRelease testDebugUnitTest lintDebug \
            > /tmp/build.log 2>&1
          echo "exit=$?" >> $GITHUB_OUTPUT
          tail -5 /tmp/build.log

      - name: APK sizes
        if: always()
        run: |
          find app/build/outputs/apk -name "*.apk" -printf "%f  %s bytes\n" 2>/dev/null || true

      - name: Stage the release APK as Bokeya.apk
        if: always()
        run: |
          mkdir -p artifacts
          # One deliverable only. The release variant carries the real
          # application id and is minified, so it is the build to install.
          SRC=$(find app/build/outputs/apk/release -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$SRC" ]; then
            cp "$SRC" artifacts/Bokeya.apk
          fi
          ls -lh artifacts || true

      - name: Upload Bokeya.apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bokeya
          path: artifacts/Bokeya.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Collect failures
        if: always()
        run: |
          {
            echo "STATUS exit=${{ steps.build.outputs.exit }}"
            echo ""
            # Kotlin/Java compile errors, resource errors, Gradle failures
            grep -n -E "^e: |error:|ERROR|FAILURE:|Caused by:|Unresolved reference|Execution failed|> Task .* FAILED" /tmp/build.log \
              | head -120
            echo ""
            echo "--- last 60 lines ---"
            tail -60 /tmp/build.log
          } > /tmp/report.txt
          wc -l /tmp/report.txt

      - name: Test reports
        if: always()
        run: |
          if ls app/build/reports/tests/testDebugUnitTest/index.html >/dev/null 2>&1; then
            echo "--- unit test failures ---" >> /tmp/report.txt
            # Pair each failure with the test that produced it. The XML puts
            # <failure> inside its <testcase>, but both can span lines, so
            # flatten first and then match the pair.
            find app/build/test-results -name "*.xml" -exec grep -l "<failure\|<error" {} \; 2>/dev/null | head -20 \
              | while read f; do
                  echo "== $(basename "$f")" >> /tmp/report.txt
                  tr '\n' ' ' < "$f" \
                    | grep -o '<testcase name="[^"]*"[^>]*>[^<]*<\(failure\|error\)[^>]*message="[^"]*"' \
                    | sed -e 's/<testcase name="/  FAILED: /' \
                          -e 's/"[^>]*>[^<]*<\(failure\|error\)[^>]*message="/\n     -> /' \
                          -e 's/"$//' \
                    | head -40 >> /tmp/report.txt
                done
          fi
          echo "done"

      - name: Report to issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(printf 'BUILD run %s (%s)\n```\n%s\n```' \
            "${{ github.run_id }}" "${{ github.sha }}" "$(head -c 55000 /tmp/report.txt)")
          gh api repos/${{ github.repository }}/issues/1/comments -f body="$BODY" --jq '.id'

      - name: Publish Bokeya.apk to the rolling "latest-build" release
        if: steps.build.outputs.exit == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Best effort: a permissions-restricted token must not fail the build.
          set +e
          gh release delete latest-build --yes --cleanup-tag 2>/dev/null
          gh release create latest-build artifacts/Bokeya.apk \
            --title "Bokeya - latest build" \
            --prerelease \
            --notes "Install \`Bokeya.apk\`. Built from \`${{ github.sha }}\`.

          Requires Android 7.0 or newer. Enable \"Install unknown apps\" for your browser or file manager first.

          Note: this build is signed with the debug keystore so CI can publish a runnable APK. Swap in a real upload key before releasing on Play."
          echo "release step exit=$?"
          exit 0

      - name: Fail if build failed
        if: steps.build.outputs.exit != '0'
        run: exit 1
