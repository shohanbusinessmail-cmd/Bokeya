# Robolectric ships Android runtimes only up to SDK 35, while the app targets
# SDK 36. Without pinning this, every Robolectric test aborts with
# "targetSdkVersion=36 > maxSdkVersion=35" before it runs a single line.
#
# Raise this in step with Robolectric once an SDK 36 runtime is published.
sdk=35
